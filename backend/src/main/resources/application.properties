# ===================================================================
# Student Opportunity Discovery Platform - Application Configuration
# ===================================================================

# Application Name & Port
spring.application.name=OpportunityHub
server.port=${PORT:8080}

# -------------------------------------------------------------------
# Profile Selection:
# By default, we use H2 file-backed database so the project runs
# instantly without any external database setup or password hurdles.
#
# To switch to your local MySQL 8.0 server, either:
# 1. Change the line below to: spring.profiles.active=mysql
# 2. Or run via command line: ./mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
# -------------------------------------------------------------------
spring.profiles.active=default

# ===================================================================
# Default In-Memory / File-based Database (H2) Settings
# Stores data in a local file so data persists between server restarts.
# ===================================================================
spring.datasource.url=jdbc:h2:file:./data/opportunitydb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static Web Resources (Frontend HTML/CSS/JS served directly from classpath)
spring.web.resources.static-locations=classpath:/static/

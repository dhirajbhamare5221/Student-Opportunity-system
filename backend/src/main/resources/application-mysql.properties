# ===================================================================
# MySQL 8.0 Server Configuration Profile (Active with spring.profiles.active=mysql)
# ===================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/student_opportunity_platform?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# If your local MySQL root password is 12345678 or root, specify it here:
spring.datasource.password=12345678

# Hibernate / JPA configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
